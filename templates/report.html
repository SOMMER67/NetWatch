{% extends "base.html" %}

{% block title %}NetWatch — Soumettre un rapport d'incident{% endblock %}

{% block content %}
<div class="form-container">
    <div style="margin-bottom: 24px; text-align: center;">
        <h1 style="font-size: 24px; font-weight: 800; color: var(--blue-900);">Nouveau Rapport d'Intervention / Incident</h1>
        <p style="color: var(--text-muted); font-size: 14px;">Enregistrez une anomalie réseau, une modification de configuration ou une maintenance d'infrastructure.</p>
    </div>

    <div class="section-card" style="padding: 30px;">
        <form method="POST" action="{{ url_for('create_report') }}">
            
            <div class="form-group">
                <label for="title" class="form-label">Titre de l'intervention / incident *</label>
                <input type="text" id="title" name="title" class="form-control" placeholder="Ex: Déploiement nouvelle règle groupe de sécurité EC2" value="{{ form.get('title', '') }}" required>
            </div>

            <div class="form-grid-2">
                <div class="form-group">
                    <label for="device" class="form-label">Équipement concerné</label>
                    <select id="device" name="device" class="form-control">
                        {% for dev in devices %}
                            <option value="{{ dev.name }} ({{ dev.ip }})" {% if form.get('device') == dev.name %}selected{% endif %}>
                                {{ dev.name }} — {{ dev.ip }}
                            </option>
                        {% endfor %}
                        <option value="Autre infrastructure">Autre infrastructure</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="category" class="form-label">Catégorie</label>
                    <select id="category" name="category" class="form-control">
                        <option value="Sécurité">Sécurité & Pare-Feu</option>
                        <option value="Configuration">Configuration Docker & Cloud</option>
                        <option value="Performance">Performance & Bande Passante</option>
                        <option value="Maintenance">Maintenance Matériel / Réseau</option>
                        <option value="Autre">Autre</option>
                    </select>
                </div>
            </div>

            <div class="form-grid-2">
                <div class="form-group">
                    <label for="severity" class="form-label">Niveau de sévérité</label>
                    <select id="severity" name="severity" class="form-control">
                        <option value="Faible">Faible (Informationnel)</option>
                        <option value="Moyenne" selected>Moyenne (Action préventive)</option>
                        <option value="Élevée">Élevée (Dégradation de service)</option>
                        <option value="Critique">Critique (Interruption majeure)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="reporter" class="form-label">Technicien / Déclarant *</label>
                    <input type="text" id="reporter" name="reporter" class="form-control" placeholder="Ex: Touré Ibrahim Hermann Junior" value="{{ form.get('reporter', '') }}" required>
                </div>
            </div>

            <div class="form-group">
                <label for="description" class="form-label">Description détaillée de l'incident et actions menées *</label>
                <textarea id="description" name="description" class="form-control" placeholder="Détaillez les symptômes observés, les tests effectués (ping, curl, docker logs) et la solution apportée..." required>{{ form.get('description', '') }}</textarea>
            </div>

            <div style="display: flex; justify-content: flex-end; gap: 12px; margin-top: 24px; border-top: 1px solid var(--border-light); padding-top: 20px;">
                <a href="{{ url_for('dashboard') }}" class="btn btn-outline">Annuler</a>
                <button type="submit" class="btn btn-success">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
                    Enregistrer le rapport
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
